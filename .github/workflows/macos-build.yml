# Optional tool: builds and tests TokenBar on a macOS runner and renders the UI snapshots.
# It runs ONLY when started by hand (Actions tab > "macOS build and snapshots" > Run workflow, or
# `gh workflow run macos-build.yml --ref <branch>`); pushes never start it, because macOS minutes
# on a private repository are billed at ten times the Linux rate.
name: macOS build and snapshots

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image (its default Xcode must be able to target macOS 13)
        required: false
        default: macos-15

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        id: toolchain
        run: |
          mkdir -p ci-logs
          {
            sw_vers
            xcodebuild -version
            swift --version 2>&1
            uname -m
          } | tee ci-logs/toolchain.txt
          echo "key=$(shasum -a 256 ci-logs/toolchain.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"
          {
            echo '### Toolchain'
            echo '```'
            cat ci-logs/toolchain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.key }}-

      # Warnings are kept in the log artifact; only errors fail the build.
      - name: Build (debug)
        run: |
          set -o pipefail
          swift build --product TokenBar 2>&1 | tee ci-logs/swift-build.log

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee ci-logs/swift-test.log

      - name: Build TokenBar.app (release)
        run: |
          set -o pipefail
          scripts/build-app.sh --no-install 2>&1 | tee ci-logs/build-app.log

      - name: Render UI snapshots
        timeout-minutes: 5
        run: |
          set -o pipefail
          build/TokenBar.app/Contents/MacOS/TokenBar --snapshot snapshots 2>&1 | tee ci-logs/snapshot.log

      - name: Collect warnings and zip the app
        if: always()
        run: |
          mkdir -p ci-logs
          grep -h 'warning:' ci-logs/*.log 2>/dev/null | sort -u > ci-logs/warnings.txt || true
          echo "Compiler warnings: $(wc -l < ci-logs/warnings.txt | tr -d ' ') (see the build-logs artifact)" >> "$GITHUB_STEP_SUMMARY"
          if [ -d build/TokenBar.app ]; then
            ditto -c -k --keepParent build/TokenBar.app TokenBar.app.zip
          fi

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci-logs
          retention-days: 14

      - name: Upload TokenBar.app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TokenBar-app
          path: TokenBar.app.zip
          if-no-files-found: warn
          retention-days: 14
